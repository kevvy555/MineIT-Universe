<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MineIT Universe Explorer — Approved Concept Reference</title>
<style>
:root{--bg:#05090c;--panel:#091117;--panel2:#101a21;--line:#273a45;--text:#edf4f7;--muted:#8ea1ac;--accent:#67c8ff;--selected:#153247}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}button,input{font:inherit;color:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}header{padding:8px 10px;background:#081015;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.tag{font-size:9px;color:#f4c56d}.workspace{min-height:0;display:flex;flex-direction:column}.detail{flex:0 0 60%;min-height:0;overflow:auto;padding:12px}.divider{height:15px;flex:none;border-block:1px solid var(--line);background:#081015;display:grid;place-items:center;touch-action:none}.divider:after{content:"";width:56px;height:4px;border-radius:99px;background:#47606e}.explorer{min-height:0;flex:1;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:6px;padding:7px 8px;background:#081015}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tabs button,.action{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px;font-size:10px;font-weight:800}.tabs button.active{background:#163044;border-color:#3e87ad}.search{width:100%;border:1px solid var(--line);background:#071015;border-radius:6px;padding:7px}.tree{overflow:auto}.tree ul{list-style:none;margin:0;padding-left:15px}.row{min-height:29px;display:flex;align-items:center;border-radius:5px}.row.selected{background:var(--selected)}.toggle{width:22px;border:0;background:transparent}.node{border:0;background:transparent;text-align:left}.hero{display:flex;gap:10px;align-items:center}.icon{width:70px;height:70px;display:grid;place-items:center;border:1px solid #36515f;border-radius:9px;color:var(--accent);font-weight:900}.type{font-size:9px;color:#8ce2bd;text-transform:uppercase}.detail h1{font-size:21px;margin:3px 0}.desc{font-size:12px;line-height:1.5;color:#d7e2e7;margin-top:10px}.card{margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.card h2{margin:0;padding:7px 9px;background:#0e171d;color:#9fb4bf;font-size:9px;text-transform:uppercase}.field{display:grid;grid-template-columns:35% 1fr;gap:8px;padding:7px 9px;border-top:1px solid #17252d;font-size:11px}.label{color:var(--muted)}.link{border:0;background:transparent;padding:0;color:#dff4ff;text-decoration:underline;text-align:left}.link:after{content:" →";color:var(--accent)}.note{font-size:9px;color:#f4c56d;margin-top:10px}
</style>
</head>
<body><div class="app"><header><strong>MineIT Universe Explorer</strong><span class="tag">APPROVED CONCEPT • EMBEDDED REFERENCE</span></header><main class="workspace" id="workspace"><section class="detail" id="detail"></section><div class="divider" id="divider"></div><section class="explorer"><div class="tabs"><button class="active" data-view="geography">Geography</button><button data-view="organisation">Organisation</button><button data-view="directory">Directory</button></div><input class="search" id="search" placeholder="Search universe…"><div class="tree" id="tree"></div></section></main></div>
<script>
const e={
'system-solace':{t:'Star System',i:'✦',n:'Solace System',d:'Mature commercial system centred on Solace II.',f:[['Primary world','planet-solace-ii']]},
'planet-solace-ii':{t:'Planet',i:'●',n:'Solace II',d:'Temperate industrial world with a major orbital commercial ring.',f:[['System','system-solace'],['Station','station-solace-commercial-ring']]},
'station-solace-commercial-ring':{t:'Station',i:'⬡',n:'Solace Commercial Ring',d:'Orbital trade, corporate administration and high-value freight hub.',f:[['Planet','planet-solace-ii'],['Company','company-helix-industrial-group'],['Buyer','person-talia-chen']]},
'company-helix-industrial-group':{t:'Company',i:'H',n:'Helix Industrial Group',d:'Major aerospace and heavy-engineering conglomerate.',f:[['Headquarters','station-solace-commercial-ring'],['Strategic buyer','person-talia-chen']]},
'person-talia-chen':{t:'Person',i:'TC',n:'Talia Chen',d:'Strategic metals buyer responsible for critical propulsion materials.',f:[['Company','company-helix-industrial-group'],['Works at','station-solace-commercial-ring']]}
};
const trees={geography:{l:'MineIT Universe',c:[{id:'system-solace',c:[{id:'planet-solace-ii',c:[{id:'station-solace-commercial-ring',c:[{id:'company-helix-industrial-group'},{id:'person-talia-chen'}]}]}]}]},organisation:{l:'Companies',c:[{id:'company-helix-industrial-group',c:[{id:'person-talia-chen'}]}]},directory:{l:'Directory',c:[{l:'Systems',c:[{id:'system-solace'}]},{l:'Planets',c:[{id:'planet-solace-ii'}]},{l:'Locations',c:[{id:'station-solace-commercial-ring'}]},{l:'Companies',c:[{id:'company-helix-industrial-group'}]},{l:'People',c:[{id:'person-talia-chen'}]}]}};
let view='geography',selected='company-helix-industrial-group';const open=new Set(['label:MineIT Universe','system-solace','planet-solace-ii','station-solace-commercial-ring','label:Companies','company-helix-industrial-group','label:Directory']);const tree=document.getElementById('tree'),detail=document.getElementById('detail'),search=document.getElementById('search');const key=n=>n.id||`label:${n.l}`,name=n=>n.id?e[n.id].n:n.l;
function node(n){const li=document.createElement('li'),r=document.createElement('div');r.className='row'+(n.id===selected?' selected':'');const kids=n.c||[],isOpen=open.has(key(n));const t=document.createElement('button');t.className='toggle';t.textContent=kids.length?(isOpen?'▾':'▸'):'';t.onclick=()=>{isOpen?open.delete(key(n)):open.add(key(n));renderTree()};const b=document.createElement('button');b.className='node';b.textContent=name(n);b.onclick=()=>n.id?select(n.id):(isOpen?open.delete(key(n)):open.add(key(n)),renderTree());r.append(t,b);li.append(r);if(kids.length&&isOpen){const ul=document.createElement('ul');kids.forEach(x=>ul.append(node(x)));li.append(ul)}return li}
function renderTree(){tree.innerHTML='';const q=search.value.trim().toLowerCase();const ul=document.createElement('ul');if(q){Object.keys(e).filter(id=>`${e[id].n} ${e[id].t} ${e[id].d}`.toLowerCase().includes(q)).forEach(id=>ul.append(node({id})))}else ul.append(node(trees[view]));tree.append(ul)}
function link(id){return `<button class="link" data-ref="${id}">${e[id].n}</button>`}function renderDetail(){const x=e[selected];detail.innerHTML=`<div class="hero"><div class="icon">${x.i}</div><div><div class="type">${x.t}</div><h1>${x.n}</h1></div></div><div class="desc">${x.d}</div><div class="card"><h2>Details</h2>${x.f.map(([a,b])=>`<div class="field"><span class="label">${a}</span>${link(b)}</div>`).join('')}</div><div class="note">Reference prototype only. Production Directory reads canonical JSON.</div>`;detail.querySelectorAll('[data-ref]').forEach(b=>b.onclick=()=>select(b.dataset.ref))}function select(id){selected=id;renderDetail();renderTree()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));renderTree()});search.oninput=renderTree;
let drag=false;const divider=document.getElementById('divider'),workspace=document.getElementById('workspace');divider.onpointerdown=x=>{drag=true;divider.setPointerCapture(x.pointerId)};divider.onpointermove=x=>{if(!drag)return;const r=workspace.getBoundingClientRect(),p=Math.max(25,Math.min(75,(x.clientY-r.top)/r.height*100));detail.style.flexBasis=p+'%'};divider.onpointerup=()=>drag=false;renderTree();renderDetail();
</script></body></html>
