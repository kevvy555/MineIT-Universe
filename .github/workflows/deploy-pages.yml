name: Deploy GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage public site
        shell: bash
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='Originals/' \
            --exclude='assets/art/universe/buildings/mobile-levels-3d/' \
            ./ _site/

          published_bytes=$(du -sb _site | cut -f1)
          maximum_bytes=1073741824
          if (( published_bytes >= maximum_bytes )); then
            echo "Published site is ${published_bytes} bytes; GitHub Pages requires less than ${maximum_bytes}." >&2
            exit 1
          fi
          echo "Staged ${published_bytes} bytes for GitHub Pages."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
