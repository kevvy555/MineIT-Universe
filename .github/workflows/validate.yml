name: Validate MineIT Universe

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical universe
        run: node validation/validate-universe.mjs
      - name: Validate industrial catalogue
        run: node validation/validate-industrial-catalogue.mjs
      - name: Validate ship procurement data
        run: node validation/validate-ship-procurement.mjs
      - name: Syntax check industrial importer
        run: node --check scripts/import-industrial-catalogue.mjs
      - name: Syntax check data loader
        run: node --check js/universe-data.js
      - name: Validate unified Substance catalogue and Android audit crosswalk
        run: node validation/validate-substance-table.mjs
      - name: Validate consolidated Parts roles, material links, and reference costs
        run: node validation/validate-parts-consolidation.mjs
      - name: Validate consolidated Machine BOMs, links, approvals and review UX
        run: node validation/validate-machines-consolidation.mjs
      - name: Validate industrial Parts, Machines and Buildings review tables
        run: node validation/validate-industrial-review-tables.mjs
      - name: Validate shared catalogue approvals and reference tables
        run: node validation/validate-approval-governance.mjs
      - name: Syntax check approval derivation
        run: node --check js/catalogue-approval.js
      - name: Syntax check approval reference tables
        run: node --check js/approval-tables.js
      - name: Syntax check industrial review module
        run: node --check js/industrial-table.js
      - name: Syntax check Substance table data
        run: node --check js/substance-table-data.js
      - name: Syntax check Substance table interface
        run: node --check js/substance-table.js
      - name: Syntax check Directory app
        run: node --check js/universe-app.js
      - name: Syntax check Commercial Network app
        run: node --check js/commercial-network-app.js
      - name: Syntax check Lore app
        run: node --check js/lore-app.js
      - name: Syntax check Ship Catalogue app
        run: node --check js/ship-catalogue-app.js
      - name: Syntax check World Atlas app
        run: node --check js/world-atlas.js
